name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [shared, notion_publisher, worker, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install ./shared ruff pytest pytest-asyncio respx
          pip install -r worker/requirements.txt -r gateway/requirements.txt
      - name: Lint
        run: ruff check ${{ matrix.suite }}
      - name: Test
        run: pytest -q ${{ matrix.suite }}/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q

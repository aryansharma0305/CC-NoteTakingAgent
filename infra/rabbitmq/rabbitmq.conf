# Static topology (exchanges, vn.work, vn.dlq, user vn/vn) is loaded at boot.
# Retry queues (vn.retry.<delay>s) are declared by workers from RETRY_DELAYS.
load_definitions = /etc/rabbitmq/definitions.json

# Workers use heartbeat=30, so a hung worker is detected in ~60 s; a killed
# worker's TCP close is detected immediately and its unacked message requeued.
heartbeat = 30

# A single stage can legitimately take a few minutes; leave ample room.
consumer_timeout = 3600000

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Notes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="20" height="20" />
        <span>Video Notes</span>
      </div>
      <div class="top-right">
        <span id="conn" class="pill" hidden></span>
        <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="connect" class="connect" hidden>
      <h1>Connect Notion</h1>
      <p>Notes are published as pages in your Notion workspace. Connect once and the extension remembers it.</p>
      <button id="connect-btn" class="primary">Connect Notion</button>
      <p class="muted small">Or <a href="#" id="use-token">use an internal integration token</a>.</p>
      <p id="connect-error" class="error-text" hidden></p>
    </section>

    <main id="jobs" class="jobs" hidden></main>

    <section id="empty" class="empty" hidden>
      <p><strong>No notes yet.</strong></p>
      <p class="muted">Open a YouTube video and click <em>Take Notes</em> in the player's toolbar.</p>
    </section>

    <template id="job-tpl">
      <article class="card">
        <div class="card-head">
          <img class="thumb" alt="" width="96" height="54" />
          <div class="meta">
            <div class="title"></div>
            <div class="sub muted small"></div>
          </div>
          <button class="dismiss icon-btn" title="Remove from list" aria-label="Remove from list">×</button>
        </div>
        <ol class="stepper" aria-label="Progress"></ol>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="status">
          <span class="dot" aria-hidden="true"></span>
          <div class="status-text">
            <div class="headline"></div>
            <div class="detail small"></div>
          </div>
        </div>
        <div class="actions"></div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidnotes-common"
version = "1.0.0"
description = "Shared contracts for the video note-taking agent (status, messages, errors, models, config, crypto)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42",
    "aio-pika>=9.4",
]

[tool.setuptools.packages.find]
include = ["vidnotes_common*"]

[tool.setuptools.package-data]
vidnotes_common = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako"]
